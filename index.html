<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1220">
<title>بچو ته خط</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

:root{
  --bg:#07101d;
  --bg2:#0c1727;
  --card:rgba(15,27,45,.92);
  --card2:#111f33;
  --text:#f5f7fb;
  --muted:#aab5c5;
  --accent:#27d17f;
  --accent2:#1da96b;
  --border:rgba(255,255,255,.08);
  --shadow:0 15px 45px rgba(0,0,0,.35);
}

body.light-mode{
  --bg:#f2f5f8;
  --bg2:#ffffff;
  --card:rgba(255,255,255,.96);
  --card2:#ffffff;
  --text:#172033;
  --muted:#657083;
  --accent:#159b5b;
  --accent2:#0e7e49;
  --border:rgba(0,0,0,.08);
  --shadow:0 12px 35px rgba(25,35,50,.12);
}

body{
  min-height:100vh;
  font-family:Tahoma,Arial,sans-serif;
  color:var(--text);
  background:
    linear-gradient(rgba(3,9,17,.78),rgba(3,9,17,.9)),
    repeating-linear-gradient(
      90deg,
      transparent 0,
      transparent 48px,
      rgba(255,255,255,.018) 49px,
      transparent 50px
    ),
    var(--bg);
  transition:
    background-color .35s ease,
    color .35s ease;
  overflow-x:hidden;
}

body.light-mode{
  background:
    linear-gradient(rgba(245,248,251,.93),rgba(245,248,251,.97)),
    var(--bg);
}

/* =========================
   THEME TRANSITION
========================= */

::view-transition-old(root),
::view-transition-new(root){
  animation:none;
  mix-blend-mode:normal;
}

::view-transition-new(root){
  clip-path:circle(
    0px at var(--theme-x) var(--theme-y)
  );

  animation:
    theme-circle-expand .65s
    cubic-bezier(.22,1,.36,1)
    forwards;
}

@keyframes theme-circle-expand{
  to{
    clip-path:circle(
      var(--theme-radius)
      at var(--theme-x)
      var(--theme-y)
    );
  }
}

/* =========================
   HEADER
========================= */

header{
  position:sticky;
  top:0;
  z-index:50;
  padding:18px 20px;
  background:rgba(5,12,22,.84);
  backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  transition:.35s ease;
}

body.light-mode header{
  background:rgba(255,255,255,.88);
}

.header-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.logo{
  text-align:center;
}

.logo h1{
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo p{
  margin-top:5px;
  color:var(--muted);
  font-size:13px;
}

.theme-toggle{
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  width:46px;
  height:46px;
  border:none;
  border-radius:50%;
  cursor:pointer;
  font-size:21px;
  background:var(--card2);
  color:var(--text);
  border:1px solid var(--border);
  box-shadow:0 6px 20px rgba(0,0,0,.15);
  transition:
    transform .25s ease,
    background .3s ease;
  -webkit-tap-highlight-color:transparent;
}

.theme-toggle:hover{
  transform:translateY(-50%) scale(1.08);
}

.theme-toggle:active{
  transform:translateY(-50%) scale(.94);
}

/* =========================
   MAIN
========================= */

main{
  width:min(1200px,calc(100% - 32px));
  margin:0 auto;
  padding:35px 0 60px;
}

.intro{
  text-align:center;
  margin-bottom:30px;
}

.intro h2{
  font-size:25px;
  margin-bottom:10px;
}

.intro p{
  color:var(--muted);
  line-height:1.9;
}

/* =========================
   SEARCH
========================= */

.search-box{
  max-width:600px;
  margin:0 auto 28px;
  position:relative;
}

.search-box input{
  width:100%;
  height:54px;
  padding:0 20px;
  border-radius:18px;
  border:1px solid var(--border);
  outline:none;
  background:var(--card);
  color:var(--text);
  font-size:15px;
  box-shadow:var(--shadow);
  transition:.25s ease;
}

.search-box input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(39,209,127,.12);
}

.search-box input::placeholder{
  color:var(--muted);
}

/* =========================
   BIRTHDAY SECTION
========================= */

.birthday-section{
  margin:0 auto 35px;
  max-width:850px;
}

.birthday-toggle{
  width:100%;
  min-height:58px;
  border:1px solid var(--border);
  border-radius:18px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  padding:14px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  font-family:inherit;
  font-size:15px;
  font-weight:bold;
  box-shadow:var(--shadow);
  transition:.25s ease;
}

.birthday-toggle:hover{
  border-color:rgba(39,209,127,.35);
}

.birthday-toggle .arrow{
  transition:transform .3s ease;
}

.birthday-section.open .arrow{
  transform:rotate(180deg);
}

.birthday-list{
  display:none;
  margin-top:10px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.birthday-section.open .birthday-list{
  display:block;
}

.birthday-item{
  width:100%;
  border:0;
  border-bottom:1px solid var(--border);
  background:transparent;
  color:var(--text);
  padding:15px 18px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:right;
  font-family:inherit;
  cursor:pointer;
  transition:.2s ease;
}

.birthday-item:last-child{
  border-bottom:0;
}

.birthday-item:hover{
  background:rgba(39,209,127,.07);
}

.rank{
  width:31px;
  height:31px;
  flex:0 0 31px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(39,209,127,.12);
  color:var(--accent);
  font-size:13px;
  font-weight:bold;
}

.birthday-name{
  font-weight:bold;
  flex:1;
}

.birthday-count{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

/* =========================
   CARDS
========================= */

.people-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:24px;
}

.person-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:24px;
  padding:14px;
  overflow:hidden;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:
    transform .3s ease,
    box-shadow .3s ease,
    border-color .3s ease;
}

.person-card:hover{
  transform:translateY(-7px);
  border-color:rgba(39,209,127,.35);
  box-shadow:0 22px 55px rgba(0,0,0,.28);
}

.photo-frame{
  width:100%;
  aspect-ratio:4/4.6;
  border-radius:18px;
  overflow:hidden;
  background:#101827;
  border:1px solid var(--border);
}

.photo-frame img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  transition:transform .5s ease;
}

.person-card:hover .photo-frame img{
  transform:scale(1.035);
}

.person-info{
  padding:17px 5px 5px;
}

.person-info h3{
  font-size:18px;
  margin-bottom:9px;
}

.position{
  display:inline-block;
  padding:7px 10px;
  border-radius:10px;
  background:rgba(39,209,127,.1);
  color:var(--accent);
  font-size:12px;
  font-weight:bold;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-content{
  width:min(560px,100%);
  max-height:min(90vh,850px);
  overflow:auto;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:28px;
  padding:22px;
  position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.45);
  animation:modalIn .3s ease;
}

@keyframes modalIn{
  from{
    opacity:0;
    transform:translateY(15px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.close{
  position:absolute;
  top:14px;
  left:14px;
  width:40px;
  height:40px;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--text);
  font-size:22px;
  cursor:pointer;
  z-index:2;
}

.modal-photo{
  width:170px;
  height:170px;
  border-radius:50%;
  overflow:hidden;
  margin:10px auto 18px;
  border:4px solid rgba(39,209,127,.55);
  box-shadow:0 10px 35px rgba(0,0,0,.25);
}

.modal-photo img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.modal h2{
  text-align:center;
  font-size:24px;
  margin-bottom:8px;
}

.modal-position{
  text-align:center;
  color:var(--accent);
  font-weight:bold;
  margin-bottom:22px;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.detail{
  background:rgba(127,127,127,.07);
  border:1px solid var(--border);
  border-radius:15px;
  padding:13px;
}

.detail span{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-bottom:5px;
}

.detail strong{
  font-size:13px;
}

.birthday-box{
  margin-top:12px;
  padding:16px;
  border-radius:18px;
  border:1px solid rgba(39,209,127,.18);
  background:rgba(39,209,127,.07);
  text-align:center;
}

.birthday-box .title{
  color:var(--accent);
  font-weight:bold;
  font-size:13px;
  margin-bottom:9px;
}

.countdown{
  font-size:16px;
  font-weight:bold;
  line-height:1.8;
}

/* =========================
   TABLET
========================= */

@media(max-width:950px){
  .people-grid{
    grid-template-columns:repeat(2,1fr);
  }
}

  }

  }

  }

  }

  .intro p{
    font-size:13px;

  }

  .search-box{

  }

  }

  }

  .detail{

  }

  .detail span{

  }

  .detail strong{
    font-size:11px;
  }

  }

  }
}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:390px){

  .logo h1{
    font-size:19px;
  }

  .people-grid{
    gap:9px;
  }

  .person-card{
    padding:7px;
  }

  .person-info h3{
    font-size:12px;
  }

  .position{
    font-size:8px;
  }

  .birthday-name{
    font-size:12px;
  }

  .birthday-count{
    display:none;
  }
}

/* =========================
   REDUCE MOTION
========================= */

@media(prefers-reduced-motion:reduce){
  *,
  *::before,
  *::after{
    scroll-behavior:auto!important;
    animation-duration:.01ms!important;
    transition-duration:.01ms!important;
  }
}
</style>
</head>

/* =========================================
   ELEMENTS
========================================= */

const peopleGrid =
  document.getElementById("peopleGrid");

const searchInput =
  document.getElementById("searchInput");

const birthdaySection =
  document.getElementById("birthdaySection");

const birthdayToggle =
  document.getElementById("birthdayToggle");

const themeToggle =

/* =========================================
   PERSIAN DATE
========================================= */

const persianFormatter =
  new Intl.DateTimeFormat(
    "en-US-u-ca-persian",
    {
      year:"numeric",
      month:"numeric",
      day:"numeric"
    }
  );


function getPersianDate(date){

  const parts =
    persianFormatter
      .formatToParts(date);

  const result = {};

  parts.forEach(part=>{
    if(part.type !== "literal"){
      result[part.type] =
        Number(part.value);
    }
  });

  return {
    year:result.year,
    month:result.month,
    day:result.day
  };
}


/* =========================================
   NEXT BIRTHDAY
========================================= */

function getNextBirthday(person){

  const birthParts =
    person.birth.split("/").map(Number);

  const birthMonth =
    birthParts[1];

  const birthDay =
    birthParts[2];

  const now =
    new Date();

  const searchStart =
    new Date(now);

  searchStart.setHours(0,0,0,0);

  for(let i=0;i<=370;i++){

    const candidate =
      new Date(searchStart);

    candidate.setDate(
      candidate.getDate()+i
    );

    const p =
      getPersianDate(candidate);

    if(
      p.month === birthMonth &&
      p.day === birthDay
    ){

      candidate.setHours(
        0,0,0,0
      );

      if(candidate > now){
        return candidate;
      }
    }
  }

  return null;
}


/* =========================================
   COUNTDOWN
========================================= */

function getCountdownText(target){

  if(!target){
    return "تاریخ نامشخص";
  }

  const now =
    new Date();

  let diff =
    target.getTime() -
    now.getTime();

  if(diff <= 0){
    return "🎉 تولد مبارک!";
  }

  const totalSeconds =
    Math.floor(diff / 1000);

  const days =
    Math.floor(
      totalSeconds / 86400
    );

  const hours =
    Math.floor(
      (totalSeconds % 86400) / 3600
    );

  const minutes =
    Math.floor(
      (totalSeconds % 3600) / 60
    );

  const seconds =
    totalSeconds % 60;

  return `
    ${days} روز،
    ${hours} ساعت،
    ${minutes} دقیقه،
    ${seconds} ثانیه
    باقی مانده
  `;
}


function getShortCountdown(target){

  if(!target){
    return "";
  }

  const now =
    new Date();

  const diff =
    target.getTime() -
    now.getTime();

  if(diff <= 0){
    return "امروز";
  }

  const days =
    Math.ceil(
      diff / 86400000
    );

  if(days === 1){
    return "فردا";
  }

  return `${days} روز دیگر`;
}


/* =========================================
   RENDER CARDS
========================================= */

function renderPeople(list = people){

  peopleGrid.innerHTML = "";

  if(!list.length){

    peopleGrid.innerHTML = `
      <div style="
        grid-column:1/-1;
        text-align:center;
        padding:35px;
        color:var(--muted);
      ">
        کسی با این اسم پیدا نشد.
      </div>
    `;

    return;
  }

  list.forEach((person,index)=>{

    const card =
      document.createElement("article");

    card.className =
      "person-card";

    card.innerHTML = `

      <div class="photo-frame">

        <img
          src="${person.image}"
          alt="${person.name}"
          loading="lazy">

      </div>

      <div class="person-info">

        <h3>
          ${person.name}
        </h3>

        <span class="position">
          ${person.futsal}
        </span>

      </div>
    `;

    card.addEventListener(
      "click",
      ()=>openProfile(person)
    );

    peopleGrid.appendChild(card);

  });
}


/* =========================================
   SEARCH
========================================= */

searchInput.addEventListener(
  "input",
  ()=>{

    const value =
      searchInput.value
        .trim()
        .toLowerCase();

    const filtered =
      people.filter(person=>
        person.name
          .toLowerCase()
          .includes(value)
      );

    renderPeople(filtered);

  }
);


/* =========================================
   BIRTHDAY LIST
========================================= */

function renderBirthdays(){

  const sorted =
    people
      .map(person=>({

        person,

        next:
          getNextBirthday(person)

      }))
      .filter(item=>item.next)

      .sort(
        (a,b)=>
          a.next - b.next
      );

  birthdayList.innerHTML = "";

  sorted.forEach(
    (item,index)=>{

      const button =
        document.createElement("button");

      button.className =
        "birthday-item";

      button.innerHTML = `

        <span class="rank">
          ${index+1}
        </span>

        <span class="birthday-name">
          ${item.person.name}
        </span>

        <span class="birthday-count">
          ${getShortCountdown(item.next)}
        </span>

      `;

      button.addEventListener(
        "click",
        ()=>openProfile(item.person)
      );

      birthdayList.appendChild(button);

    }
  );
}


birthdayToggle.addEventListener(
  "click",
  ()=>{

    birthdaySection.classList.toggle(
      "open"
    );

    if(
      birthdaySection.classList.contains(
        "open"
      )
    ){
      renderBirthdays();
    }

  }
);


/* =========================================
   MODAL
========================================= */

function openProfile(person){

  document.getElementById(
    "modalImage"
  ).src = person.image;

  document.getElementById(
    "modalImage"
  ).alt = person.name;

  document.getElementById(
    "modalName"
  ).textContent = person.name;

  document.getElementById(
    "modalPosition"
  ).textContent = person.futsal;

  document.getElementById(
    "modalAge"
  ).textContent = person.age;

  document.getElementById(
    "modalBirth"
  ).textContent = person.birth;

  document.getElementById(
    "modalSchool"
  ).textContent = person.school;

  document.getElementById(
    "modalGrade"
  ).textContent = person.grade;

  const target =
    getNextBirthday(person);

  document.getElementById(
    "modalCountdown"
  ).textContent =
    getCountdownText(target);

  modal.classList.add("show");

  document.body.style.overflow =
    "hidden";
}


function closeProfile(){

  modal.classList.remove("show");

  document.body.style.overflow =
    "";
}


closeModal.addEventListener(
  "click",
  closeProfile
);


modal.addEventListener(
  "click",
  event=>{

    if(event.target === modal){
      closeProfile();
    }

  }
);


document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Escape" &&
      modal.classList.contains("show")
    ){
      closeProfile();
    }

  }
);


/* =========================================
   UPDATE COUNTDOWN
========================================= */

setInterval(()=>{

  if(!modal.classList.contains("show")){
    return;
  }

  const name =
    document.getElementById(
      "modalName"
    ).textContent;

  const person =
    people.find(
      p=>p.name === name
    );

  if(person){

    const target =
      getNextBirthday(person);

    document.getElementById(
      "modalCountdown"
    ).textContent =
      getCountdownText(target);

  }

},1000);


/* =========================================
   THEME
========================================= */

function getThemeCirclePosition(){

  const rect =
    themeToggle.getBoundingClientRect();

  const x =
    rect.left +
    rect.width / 2;

  const y =
    rect.top +
    rect.height / 2;

  const radius =
    Math.hypot(
      Math.max(
        x,
        window.innerWidth-x
      ),
      Math.max(
        y,
        window.innerHeight-y
      )
    );

  return {
    x,
    y,
    radius
  };
}


function updateTheme(){

  const isLight =
    document.body.classList.toggle(
      "light-mode"
    );

  localStorage.setItem(
    "friendsSiteTheme",
    isLight ? "light" : "dark"
  );

  themeToggle.textContent =
    isLight ? "☀️" : "🌙";

  document
    .querySelector('meta[name="theme-color"]')
    .setAttribute(
      "content",
      isLight ? "#f2f5f8" : "#07101d"
    );
}


function changeTheme(){

  const position =
    getThemeCirclePosition();

  document.documentElement.style.setProperty(
    "--theme-x",
    `${position.x}px`
  );

  document.documentElement.style.setProperty(
    "--theme-y",
    `${position.y}px`
  );

  document.documentElement.style.setProperty(
    "--theme-radius",
    `${position.radius}px`
  );

  if(
    !document.startViewTransition
  ){

    document.body.classList.add(
      "theme-fading"
    );

    updateTheme();

    setTimeout(()=>{
      document.body.classList.remove(
        "theme-fading"
      );
    },120);

    return;
  }

  document.startViewTransition(
    ()=>updateTheme()
  );
}


themeToggle.addEventListener(
  "click",
  changeTheme
);


/* =========================================
   LOAD SAVED THEME
========================================= */

const savedTheme =
  localStorage.getItem(
    "friendsSiteTheme"
  );

if(savedTheme === "light"){

  document.body.classList.add(
    "light-mode"
  );

  themeToggle.textContent = "☀️";

  document
    .querySelector('meta[name="theme-color"]')
    .setAttribute(
      "content",
      "#f2f5f8"
    );
}


/* =========================================
   INITIAL RENDER
========================================= */

renderPeople();

</script>

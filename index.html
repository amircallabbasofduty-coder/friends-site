<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بچو ته خط</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f6f7f9;
            color: #202124;
        }


        /* ---------------- HEADER ---------------- */

        header {
            background: #ffffff;
            padding: 55px 20px 45px;
            text-align: center;
            border-bottom: 1px solid #e8e8e8;
        }

        header h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        header p {
            color: #777;
            font-size: 15px;
        }


        /* ---------------- MAIN ---------------- */

        main {
            max-width: 1150px;
            margin: 55px auto;
            padding: 0 22px;
        }


        .section-title {
            text-align: center;
            margin-bottom: 40px;
        }

        .section-title h2 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .section-title p {
            color: #777;
            font-size: 14px;
        }


        /* ---------------- CARDS ---------------- */

        .friends {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }


        .friend {
            background: #ffffff;
            border-radius: 22px;
            overflow: hidden;

            border: 1px solid #eeeeee;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.05);

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }


        .friend:hover {
            transform: translateY(-8px);

            box-shadow:
                0 18px 40px rgba(0, 0, 0, 0.10);
        }


        /* ---------------- IMAGE ---------------- */

        .photo {
            padding: 14px;
            background: #fafafa;
        }

        .photo img {
            width: 100%;
            height: 310px;

            object-fit: cover;

            display: block;

            border-radius: 16px;
        }


        /* ---------------- INFO ---------------- */

        .info {
            padding: 24px;
            text-align: center;
        }


        .info h3 {
            font-size: 22px;
            margin-bottom: 10px;
        }


        .short-info {
            color: #777;
            font-size: 14px;
            line-height: 2;

            margin-bottom: 20px;
        }


        /* ---------------- BUTTON ---------------- */

        .info button {
            width: 100%;

            border: none;

            background: #222;
            color: white;

            padding: 13px;

            border-radius: 12px;

            font-family: inherit;
            font-size: 14px;

            cursor: pointer;

            transition: 0.25s;
        }


        .info button:hover {
            background: #444;
        }


        /* ---------------- MODAL ---------------- */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            z-index: 1000;

            background: rgba(0, 0, 0, 0.55);

            align-items: center;
            justify-content: center;

            padding: 20px;
        }


        .modal-content {
            position: relative;

            width: 100%;
            max-width: 470px;

            background: white;

            border-radius: 24px;

            padding: 35px 30px;

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.20);

            animation: modalShow 0.25s ease;
        }


        @keyframes modalShow {

            from {
                opacity: 0;
                transform: translateY(20px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

        }


        .close {
            position: absolute;

            left: 20px;
            top: 15px;

            width: 35px;
            height: 35px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #f2f2f2;

            color: #555;

            font-size: 22px;

            cursor: pointer;

            transition: 0.2s;
        }


        .close:hover {
            background: #e5e5e5;
        }


        .modal-content h2 {
            text-align: center;

            font-size: 25px;

            margin-bottom: 25px;
        }


        .details {
            background: #f7f7f7;

            border-radius: 15px;

            padding: 20px;

            line-height: 2.4;

            font-size: 14px;
        }


        .details b {
            color: #222;
        }


        /* ---------------- FOOTER ---------------- */

        footer {
            margin-top: 70px;

            background: white;

            border-top: 1px solid #eeeeee;

            text-align: center;

            padding: 30px 15px;

            color: #888;

            font-size: 13px;
        }


        /* ---------------- MOBILE ---------------- */

        @media (max-width: 850px) {

            .friends {
                grid-template-columns: 1fr 1fr;
            }

        }


        @media (max-width: 600px) {

            header {
                padding: 40px 18px;
            }


            header h1 {
                font-size: 32px;
            }


            main {
                margin: 35px auto;
                padding: 0 15px;
            }


            .section-title {
                margin-bottom: 25px;
            }


            .section-title h2 {
                font-size: 23px;
            }


            .friends {
                grid-template-columns: 1fr;

                gap: 22px;
            }


            .photo img {
                height: 330px;
            }


            .info {
                padding: 22px;
            }


            .modal-content {
                padding: 30px 20px;
            }

        }

    </style>
</head>


<body>


<!-- HEADER -->

<header>

    <h1>بچو ته خط</h1>

    <p>
        یه معرفی ساده از بچه‌های ته خط
    </p>

</header>



<!-- MAIN -->

<main>


    <div class="section-title">

        <h2>
            بچه‌های ته خط
        </h2>

        <p>
            برای دیدن اطلاعات هر نفر روی «مشاهده معرفی» بزنید.
        </p>

    </div>



    <div class="friends">


        <!-- سجاد -->

        <div class="friend">

            <div class="photo">

                <img
                    src="images/ChatGPT%20Image%20Aug%2023%2C%202026%2C%2003_13_17%20PM.jpg"
                    alt="سجاد حسنی تبار">

            </div>


            <div class="info">

                <h3>
                    سجاد حسنی تبار
                </h3>

                <div class="short-info">
                    ۱۷ ساله<br>
                    بازیکن فوتسال
                </div>

                <button onclick="showInfo('sajad')">
                    مشاهده معرفی
                </button>

            </div>

        </div>



        <!-- یوسف -->

        <div class="friend">

            <div class="photo">

                <img
                    src="images/yoosef.jpg"
                    alt="یوسف سالاری">

            </div>


            <div class="info">

                <h3>
                    یوسف سالاری
                </h3>

                <div class="short-info">
                    ۱۶ ساله<br>
                    بازیکن فوتسال
                </div>

                <button onclick="showInfo('yoosef')">
                    مشاهده معرفی
                </button>

            </div>

        </div>



        <!-- احمد -->

        <div class="friend">

            <div class="photo">

                <img
                    src="images/aahmad.jpg"
                    alt="احمد اسماعیل زاده">

            </div>


            <div class="info">

                <h3>
                    احمد اسماعیل زاده
                </h3>

                <div class="short-info">
                    ۱۷ ساله<br>
                    بازیکن فوتسال
                </div>

                <button onclick="showInfo('ahmad')">
                    مشاهده معرفی
                </button>

            </div>

        </div>


    </div>

</main>



<!-- MODAL -->

<div class="modal" id="modal">


    <div class="modal-content">


        <span class="close" onclick="closeInfo()">
            ×
        </span>


        <h2 id="modalName"></h2>


        <div
            class="details"
            id="modalDetails">
        </div>


    </div>

</div>



<!-- FOOTER -->

<footer>

    بچو ته خط

</footer>



<script>


function showInfo(person) {


    const modal =
        document.getElementById("modal");


    const name =
        document.getElementById("modalName");


    const details =
        document.getElementById("modalDetails");



    if (person === "sajad") {


        name.innerText =
            "سجاد حسنی تبار";


        details.innerHTML = `

            <b>سن:</b>
            ۱۷ سال
            <br>

            <b>تاریخ تولد:</b>
            ۱۳۸۸/۸/۱۴
            <br>

            <b>مدرسه:</b>
            قائم آل محمد
            <br>

            <b>پایه تحصیلی:</b>
            یازدهم
            <br>

            <b>پست مورد علاقه در فوتسال:</b>
            مدافع / دروازه‌بان

        `;

    }



    else if (person === "yoosef") {


        name.innerText =
            "یوسف سالاری";


        details.innerHTML = `

            <b>سن:</b>
            ۱۶ سال
            <br>

            <b>تاریخ تولد:</b>
            ۱۳۸۸/۹/۴
            <br>

            <b>مدرسه:</b>
            حوزه
            <br>

            <b>پایه تحصیلی:</b>
            پایه دو
            <br>

            <b>پست مورد علاقه در فوتسال:</b>
            مهاجم

        `;

    }



    else if (person === "ahmad") {


        name.innerText =
            "احمد اسماعیل زاده";


        details.innerHTML = `

            <b>سن:</b>
            ۱۷ سال
            <br>

            <b>تاریخ تولد:</b>
            ۱۳۸۸/۱۱/۶
            <br>

            <b>مدرسه:</b>
            قائم آل محمد
            <br>

            <b>پایه تحصیلی:</b>
            یازدهم
            <br>

            <b>پست مورد علاقه در فوتسال:</b>
            هافبک

        `;

    }



    modal.style.display =
        "flex";

}



function closeInfo() {

    document.getElementById("modal").style.display =
        "none";

}



window.onclick = function(event) {

    const modal =
        document.getElementById("modal");


    if (event.target === modal) {

        modal.style.display =
            "none";

    }

}


</script>


</body>

</html>

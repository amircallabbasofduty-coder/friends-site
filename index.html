<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#07101d">
  <title>بچو ته خط</title>

  <style>
    :root {
      --bg: #07101d;
      --bg2: #0d1726;
      --card: rgba(17, 28, 43, 0.92);
      --card2: #121f30;
      --text: #f5f7fa;
      --muted: #aeb8c6;
      --border: rgba(255,255,255,.09);
      --accent: #36d17c;
      --shadow: 0 12px 35px rgba(0,0,0,.25);
    }

    body.light {
      --bg: #f2f5f8;
      --bg2: #e8edf2;
      --card: rgba(255,255,255,.94);
      --card2: #ffffff;
      --text: #18212b;
      --muted: #657180;
      --border: rgba(0,0,0,.08);
      --accent: #159957;
      --shadow: 0 10px 30px rgba(0,0,0,.10);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Tahoma, Arial, sans-serif;
      color: var(--text);

      background:
        radial-gradient(
          circle at top right,
          rgba(44,124,255,.12),
          transparent 30%
        ),
        radial-gradient(
          circle at bottom left,
          rgba(54,209,124,.09),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          var(--bg),
          var(--bg2)
        );

      transition:
        background .35s ease,
        color .35s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;

      background-image:
        linear-gradient(
          rgba(255,255,255,.5) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.5) 1px,
          transparent 1px
        );

      background-size: 35px 35px;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      padding: 34px 20px 22px;
      text-align: center;
    }

    .header-box {
      max-width: 1100px;
      margin: auto;
    }

    .logo {
      width: 68px;
      height: 68px;
      margin: 0 auto 14px;

      border-radius: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 31px;

      background:
        linear-gradient(
          135deg,
          var(--accent),
          #20a9ff
        );

      box-shadow:
        0 12px 30px rgba(31,164,99,.25);
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 900;
      letter-spacing: -1px;
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 15px;
    }

    /* =========================
       THEME BUTTON
    ========================= */

    #themeToggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;

      width: 45px;
      height: 45px;

      border: 1px solid var(--border);
      border-radius: 50%;

      background: var(--card);
      color: var(--text);

      cursor: pointer;
      font-size: 19px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    /* =========================
       MAIN
    ========================= */

    main {
      width: min(1100px, calc(100% - 28px));
      margin: 0 auto 60px;
    }

    /* =========================
       SEARCH
    ========================= */

    .search-wrap {
      position: sticky;
      top: 10px;
      z-index: 20;

      margin: 4px auto 24px;
      max-width: 650px;
    }

    .search {
      width: 100%;
      height: 52px;

      padding: 0 20px;

      border-radius: 17px;
      border: 1px solid var(--border);
      outline: none;

      background: var(--card);
      color: var(--text);

      font-size: 15px;

      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
    }

    .search::placeholder {
      color: var(--muted);
    }

    /* =========================
       BIRTHDAYS
    ========================= */

    .birthday-section {
      margin-bottom: 28px;

      border: 1px solid var(--border);
      border-radius: 20px;

      overflow: hidden;

      background: var(--card);

      box-shadow: var(--shadow);
    }

    .birthday-header {
      width: 100%;

      padding: 16px 18px;

      border: 0;
      background: transparent;
      color: var(--text);

      display: flex;
      align-items: center;
      justify-content: space-between;

      cursor: pointer;

      font-family: inherit;
      font-size: 16px;
      font-weight: 800;
    }

    /* مربع راهنمای باز شدن */

    .birthday-open-icon {
      width: 32px;
      height: 32px;

      border-radius: 9px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(54,209,124,.12);

      border: 1px solid rgba(54,209,124,.25);

      color: var(--accent);

      font-size: 22px;
      font-weight: 500;

      transition:
        transform .25s ease,
        background .25s ease;
    }

    .birthday-section.open .birthday-open-icon {
      transform: rotate(180deg);
      background: rgba(54,209,124,.20);
    }

    .birthday-list {
      display: none;
      padding: 0 12px 12px;
    }

    .birthday-section.open .birthday-list {
      display: block;
    }

    .birthday-row {
      display: flex;
      align-items: center;

      gap: 12px;

      padding: 12px;
      margin-top: 7px;

      border-radius: 14px;

      background: var(--card2);
      border: 1px solid var(--border);

      cursor: pointer;

      transition:
        transform .2s ease,
        border-color .2s ease;
    }

    .birthday-row:hover {
      transform: translateY(-2px);
      border-color: rgba(54,209,124,.35);
    }

    .birthday-rank {
      min-width: 30px;
      height: 30px;

      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(54,209,124,.13);

      color: var(--accent);
      font-weight: 900;
    }

    .birthday-name {
      flex: 1;
      font-weight: 700;
    }

    .birthday-countdown {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    /* =========================
       PEOPLE GRID
    ========================= */

    #peopleGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .person-card {
      overflow: hidden;

      border: 1px solid var(--border);
      border-radius: 22px;

      background: var(--card);

      box-shadow: var(--shadow);

      cursor: pointer;

      transition:
        transform .25s ease,
        border-color .25s ease;
    }

    .person-card:hover {
      transform: translateY(-5px);
      border-color: rgba(54,209,124,.35);
    }

    .person-image {
      width: 100%;
      aspect-ratio: 1 / 1;

      object-fit: cover;
      display: block;

      background: #111;
    }

    .person-info {
      padding: 15px;
    }

    .person-name {
      margin: 0 0 7px;

      font-size: 17px;
      font-weight: 900;
    }

    .person-position {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      grid-column: 1 / -1;

      text-align: center;
      padding: 50px 20px;

      color: var(--muted);

      border: 1px dashed var(--border);
      border-radius: 20px;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0,0,0,.68);

      backdrop-filter: blur(8px);
    }

    .modal.show {
      display: flex;
    }

    .modal-box {
      width: min(650px, 100%);

      max-height: 92vh;
      overflow-y: auto;

      position: relative;

      border-radius: 26px;

      background: var(--card2);

      border: 1px solid var(--border);

      box-shadow:
        0 30px 80px rgba(0,0,0,.35);

      animation: modalIn .25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform:
          translateY(25px)
          scale(.98);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    .close-modal {
      position: absolute;

      top: 13px;
      left: 13px;

      width: 38px;
      height: 38px;

      border: 0;
      border-radius: 50%;

      background: rgba(0,0,0,.35);

      color: white;

      cursor: pointer;
      font-size: 18px;

      z-index: 3;
    }

    .profile-image {
      width: 100%;

      height: min(390px, 65vw);

      object-fit: cover;
      display: block;

      background: #111;
    }

    .profile-content {
      padding: 22px;
    }

    .profile-name {
      margin: 0 0 18px;

      font-size: 25px;
      font-weight: 900;
    }

    .profile-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 10px;
    }

    .detail {
      padding: 13px;

      border-radius: 15px;

      background:
        rgba(127,127,127,.08);

      border: 1px solid var(--border);
    }

    .detail.full {
      grid-column: 1 / -1;
    }

    .detail-label {
      display: block;

      margin-bottom: 6px;

      color: var(--muted);
      font-size: 11px;
    }

    .detail-value {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.7;
    }

    .birthday-timer {
      margin-top: 15px;

      padding: 15px;

      border-radius: 17px;

      background:
        linear-gradient(
          135deg,
          rgba(54,209,124,.13),
          rgba(31,169,255,.10)
        );

      border:
        1px solid rgba(54,209,124,.18);
    }

    .timer-title {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 5px;
    }

    .timer-value {
      font-size: 16px;
      font-weight: 900;
    }

    /* =========================
       VIEW TRANSITION
    ========================= */

    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }

    ::view-transition-new(root) {
      z-index: 9999;
    }

    ::view-transition-old(root) {
      z-index: 1;
    }

    /* =========================
       TABLET
    ========================= */

    @media (max-width: 900px) {
      #peopleGrid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 650px) {

      header {
        padding: 25px 15px 18px;
      }

      .logo {
        width: 58px;
        height: 58px;

        border-radius: 17px;

        font-size: 27px;

        margin-bottom: 11px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 13px;
      }

      main {
        width: min(100% - 18px, 600px);
        margin-bottom: 35px;
      }

      #themeToggle {
        top: 10px;
        left: 10px;

        width: 42px;
        height: 42px;
      }

      .search-wrap {
        top: 6px;
        margin-bottom: 17px;
      }

      .search {
        height: 48px;
        border-radius: 15px;
        font-size: 14px;
      }

      .birthday-section {
        border-radius: 17px;
        margin-bottom: 18px;
      }

      .birthday-header {
        padding: 14px;
        font-size: 14px;
      }

      .birthday-open-icon {
        width: 29px;
        height: 29px;

        border-radius: 8px;

        font-size: 20px;
      }

      .birthday-row {
        padding: 10px;
        gap: 9px;
      }

      .birthday-name {
        font-size: 13px;
      }

      .birthday-countdown {
        font-size: 10px;
      }

      #peopleGrid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));

        gap: 10px;
      }

      .person-card {
        border-radius: 17px;
      }

      .person-info {
        padding: 10px;
      }

      .person-name {
        font-size: 13px;
        margin-bottom: 4px;
      }

      .person-position {
        font-size: 10px;
        line-height: 1.6;
      }

      /* MODAL */

      .modal {
        padding: 0;
        align-items: flex-end;
      }

      .modal-box {
        max-height: 92vh;

        border-radius:
          25px 25px 0 0;

        animation:
          sheetIn .28s ease;
      }

      @keyframes sheetIn {

        from {
          transform: translateY(100%);
        }

        to {
          transform: translateY(0);
        }

      }

      .profile-image {
        height: 270px;
      }

      .profile-content {
        padding: 17px;
      }

      .profile-name {
        font-size: 21px;
        margin-bottom: 14px;
      }

      .profile-grid {
        gap: 8px;
      }

      .detail {
        padding: 11px;
        border-radius: 13px;
      }

      .detail-label {
        font-size: 10px;
      }

      .detail-value {
        font-size: 12px;
      }

      .birthday-timer {
        margin-top: 10px;
        padding: 12px;
      }

      .timer-value {
        font-size: 13px;
      }
    }

    /* =========================
       SMALL MOBILE
    ========================= */

    @media (max-width: 360px) {

      #peopleGrid {
        gap: 8px;
      }

      .person-info {
        padding: 8px;
      }

      .person-name {
        font-size: 12px;
      }

      .person-position {
        font-size: 9px;
      }

      .profile-grid {
        grid-template-columns: 1fr;
      }

      .detail.full {
        grid-column: auto;
      }
    }

  </style>
</head>

        `;

        return;
      }


      list.forEach(person => {

        const originalIndex =
          people.indexOf(person);

        const card =
          document.createElement("article");

        card.className =
          "person-card";


        card.innerHTML = `

          <img
            class="person-image"
            src="${person.image}"
            alt="${person.name}"
            loading="lazy"
          >

          <div class="person-info">

            <h2 class="person-name">
              ${person.name}
            </h2>

            <div class="person-position">
              ⚽ ${person.futsal}
            </div>

          </div>

        `;


        card.addEventListener(
          "click",
          () => openProfile(originalIndex)
        );


        peopleGrid.appendChild(card);

      });

    }


    /* =========================
       جستجو
    ========================= */

    searchInput.addEventListener(
      "input",
      () => {

        const value =
          searchInput.value
            .trim()
            .toLowerCase();


        const filtered =
          people.filter(
            person =>
              person.name
                .toLowerCase()
                .includes(value)
          );


        renderPeople(filtered);

      }
    );


    /* =========================
       تاریخ شمسی
    ========================= */

    function getPersianDate(date) {

      const formatter =
        new Intl.DateTimeFormat(
          "en-US-u-ca-persian",
          {
            year: "numeric",
            month: "numeric",
            day: "numeric"
          }
        );


      const parts =
        formatter.formatToParts(date);


      const result = {};


      parts.forEach(part => {

        if (
          part.type === "year" ||
          part.type === "month" ||
          part.type === "day"
        ) {

          result[part.type] =
            Number(part.value);

        }

      });


      return result;
    }


    /* =========================
       نزدیک‌ترین تولد
    ========================= */

    function getNextBirthday(person) {

      const birthParts =
        person.birth
          .split("/")
          .map(Number);


      const birthMonth =
        birthParts[1];

      const birthDay =
        birthParts[2];


      const now =
        new Date();


      for (let i = 0; i <= 370; i++) {

        const candidate =
          new Date(now);


        candidate.setHours(
          0, 0, 0, 0
        );


        candidate.setDate(
          candidate.getDate() + i
        );


        const persian =
          getPersianDate(candidate);


        if (
          persian.month === birthMonth &&
          persian.day === birthDay &&
          candidate > now
        ) {

          return candidate;

        }

      }


      return null;
    }


    /* =========================
       شمارش معکوس
    ========================= */

    function getCountdown(target) {

      const now =
        new Date();


      let diff =
        target - now;


      if (diff < 0) {
        diff = 0;
      }


      const day =
        Math.floor(
          diff / 86400000
        );


      diff %= 86400000;


      const hour =
        Math.floor(
          diff / 3600000
        );


      diff %= 3600000;


      const minute =
        Math.floor(
          diff / 60000
        );


      const second =
        Math.floor(
          (diff % 60000) / 1000
        );


      return {
        day,
        hour,
        minute,
        second
      };

    }


    function getShortCountdown(target) {

      const c =
        getCountdown(target);


      if (c.day > 0) {
        return `${c.day} روز`;
      }


      if (c.hour > 0) {
        return `${c.hour} ساعت`;
      }


      if (c.minute > 0) {
        return `${c.minute} دقیقه`;
      }


      return `${c.second} ثانیه`;
    }


    /* =========================
       لیست تولدها
    ========================= */

    function renderBirthdays() {

      const sorted =
        people
          .map((person, index) => ({
            person,
            index,
            date: getNextBirthday(person)
          }))
          .filter(item => item.date)
          .sort(
            (a, b) =>
              a.date - b.date
          );


      birthdayList.innerHTML = "";


      sorted.forEach(
        (item, position) => {

          const row =
            document.createElement("div");


          row.className =
            "birthday-row";


          row.innerHTML = `

            <div class="birthday-rank">
              ${position + 1}
            </div>

            <div class="birthday-name">
              ${item.person.name}
            </div>

            <div class="birthday-countdown">
              ${getShortCountdown(item.date)}
            </div>

          `;


          row.addEventListener(
            "click",
            () =>
              openProfile(item.index)
          );


          birthdayList.appendChild(row);

        }
      );

    }


    /* =========================
       باز و بسته شدن تولدها
    ========================= */

    birthdayToggle.addEventListener(
      "click",
      () => {

        birthdaySection.classList.toggle(
          "open"
        );


        const icon =
          document.getElementById(
            "birthdayOpenIcon"
          );


        if (
          birthdaySection.classList.contains(
            "open"
          )
        ) {

          icon.textContent = "−";

        } else {

          icon.textContent = "+";

        }

      }
    );


    /* =========================
       پروفایل
    ========================= */

    function openProfile(index) {

      const person =
        people[index];


      selectedPerson =
        person;


      profileImage.src =
        person.image;

      profileImage.alt =
        person.name;


      profileName.textContent =
        person.name;

      profileAge.textContent =
        person.age + " سال";

      profileBirth.textContent =
        person.birth;

      profileSchool.textContent =
        person.school;

      profileGrade.textContent =
        person.grade;

      profileField.textContent =
        person.field;

      profileFutsal.textContent =
        person.futsal;


      modal.classList.add("show");


      document.body.style.overflow =
        "hidden";


      updateTimer();


      clearInterval(
        timerInterval
      );


      timerInterval =
        setInterval(
          updateTimer,
          1000
        );

    }


    function updateTimer() {

      if (!selectedPerson) {
        return;
      }


      const target =
        getNextBirthday(
          selectedPerson
        );


      if (!target) {

        birthdayTimer.textContent =
          "تاریخ تولد محاسبه نشد";

        return;
      }


      const c =
        getCountdown(target);


      birthdayTimer.textContent =
        `${c.day} روز، ${c.hour} ساعت، ${c.minute} دقیقه و ${c.second} ثانیه`;

    }


    function closeProfile() {

      modal.classList.remove(
        "show"
      );


      document.body.style.overflow =
        "";


      clearInterval(
        timerInterval
      );


      selectedPerson =
        null;

    }


    closeModal.addEventListener(
      "click",
      closeProfile
    );


    modal.addEventListener(
      "click",
      event => {

        if (
          event.target === modal
        ) {

          closeProfile();

        }

      }
    );


    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeProfile();

        }

      }
    );


    /* =========================
       حالت شب / روز
    ========================= */

    function applyTheme(theme) {

      const light =
        theme === "light";


      document.body.classList.toggle(
        "light",
        light
      );


      themeToggle.textContent =
        light ? "🌙" : "☀️";


      themeToggle.setAttribute(
        "aria-label",
        light
          ? "فعال کردن حالت شب"
          : "فعال کردن حالت روز"
      );

    }


    function getThemePosition() {

      const rect =
        themeToggle.getBoundingClientRect();


      const x =
        rect.left +
        rect.width / 2;


      const y =
        rect.top +
        rect.height / 2;


      const radius =
        Math.hypot(
          Math.max(
            x,
            window.innerWidth - x
          ),

          Math.max(
            y,
            window.innerHeight - y
          )
        );


      return {
        x,
        y,
        radius
      };

    }


    async function changeTheme() {

      const currentLight =
        document.body.classList.contains(
          "light"
        );


      const nextTheme =
        currentLight
          ? "dark"
          : "light";


      localStorage.setItem(
        "friendsSiteTheme",
        nextTheme
      );


      if (
        !document.startViewTransition
      ) {

        applyTheme(
          nextTheme
        );

        return;
      }


      const {
        x,
        y,
        radius
      } =
        getThemePosition();


      const transition =
        document.startViewTransition(
          () => {

            applyTheme(
              nextTheme
            );

          }
        );


      await transition.ready;


      document.documentElement.animate(
        [
          {
            clipPath:
              `circle(0px at ${x}px ${y}px)`
          },

          {
            clipPath:
              `circle(${radius}px at ${x}px ${y}px)`
          }

        ],

        {
          duration: 500,
          easing: "ease-out",

          pseudoElement:
            "::view-transition-new(root)"
        }
      );

    }


    themeToggle.addEventListener(
      "click",
      changeTheme
    );


    /* =========================
       تم ذخیره شده
    ========================= */

    const savedTheme =
      localStorage.getItem(
        "friendsSiteTheme"
      );


    if (
      savedTheme === "light"
    ) {

      applyTheme("light");

    } else {

      applyTheme("dark");

    }


    /* =========================
       شروع سایت
    ========================= */

    renderPeople();
    renderBirthdays();

  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>بچو ته خط ⚽</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background:
        linear-gradient(rgba(5, 10, 18, 0.88), rgba(5, 10, 18, 0.94)),
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.025) 0,
          rgba(255,255,255,0.025) 1px,
          transparent 1px,
          transparent 70px
        ),
        #07111f;
      color: #fff;
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 49.8%, rgba(255,255,255,0.035) 50%, transparent 50.2%),
        linear-gradient(0deg, transparent 49.8%, rgba(255,255,255,0.025) 50%, transparent 50.2%);
      opacity: 0.7;
      z-index: -1;
    }

    /* ================= HEADER ================= */

    header {
      position: relative;
      padding: 45px 20px 35px;
      text-align: center;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      background: rgba(3, 8, 16, 0.72);
      backdrop-filter: blur(12px);
    }

    .theme-toggle {
      position: absolute;
      left: 20px;
      top: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 21px;
      transition: 0.3s;
    }

    .theme-toggle:hover {
      transform: rotate(15deg) scale(1.08);
      background: rgba(255,255,255,0.15);
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: -2px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #aab7c7;
      font-size: 15px;
    }

    /* ================= MAIN ================= */

    .container {
      width: min(1200px, 92%);
      margin: 30px auto 60px;
    }

    /* ================= SEARCH ================= */

    .search-box {
      margin: 25px auto 30px;
      max-width: 650px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 17px 22px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      outline: none;
      background: rgba(255,255,255,0.07);
      color: white;
      font-size: 16px;
      transition: 0.3s;
    }

    .search-box input::placeholder {
      color: #8c9aaa;
    }

    .search-box input:focus {
      border-color: rgba(255,255,255,0.3);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 25px rgba(255,255,255,0.04);
    }

    /* ================= BIRTHDAY SECTION ================= */

    .birthday-section {
      margin: 0 auto 35px;
      max-width: 850px;
      border: 1px solid rgba(255,255,255,0.09);
      background: rgba(255,255,255,0.045);
      border-radius: 22px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }

    .birthday-toggle {
      width: 100%;
      border: none;
      background: transparent;
      color: white;
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .birthday-toggle-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .birthday-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.08);
      font-size: 21px;
    }

    .birthday-arrow {
      transition: transform 0.35s ease;
      color: #aeb9c8;
    }

    .birthday-section.open .birthday-arrow {
      transform: rotate(180deg);
    }

    .birthday-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.45s ease;
    }

    .birthday-section.open .birthday-list {
      max-height: 1000px;
    }

    .birthday-list-inner {
      padding: 0 14px 14px;
    }

    .birthday-person {
      width: 100%;
      border: none;
      background: rgba(255,255,255,0.035);
      color: white;
      margin-top: 7px;
      padding: 14px 16px;
      border-radius: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: 0.25s;
      font-family: inherit;
    }

    .birthday-person:hover {
      background: rgba(255,255,255,0.09);
      transform: translateX(-4px);
    }

    .birthday-person-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .birthday-rank {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      background: rgba(255,255,255,0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #cbd5e1;
      font-size: 13px;
    }

    .birthday-name {
      font-weight: bold;
    }

    .birthday-countdown {
      color: #9eabba;
      font-size: 13px;
    }

    /* ================= PEOPLE GRID ================= */

    .people-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    .person-card {
      background: rgba(255,255,255,0.055);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 24px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .person-card:hover {
      transform: translateY(-8px);
      background: rgba(255,255,255,0.075);
      box-shadow: 0 18px 45px rgba(0,0,0,0.35);
    }

    .photo-frame {
      margin: 14px;
      border-radius: 18px;
      overflow: hidden;
      height: 310px;
      background: #101927;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease;
    }

    .person-card:hover .photo-frame img {
      transform: scale(1.05);
    }

    .person-info {
      padding: 5px 20px 21px;
    }

    .person-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .person-position {
      color: #9caabd;
      font-size: 14px;
    }

    /* ================= MODAL ================= */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      width: min(700px, 100%);
      max-height: 90vh;
      overflow-y: auto;
      background: #101a29;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 25px;
      position: relative;
      animation: modalIn 0.25s ease;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(15px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .close-modal {
      position: absolute;
      left: 18px;
      top: 18px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      cursor: pointer;
      font-size: 22px;
      z-index: 3;
    }

    .modal-photo {
      width: 190px;
      height: 220px;
      border-radius: 20px;
      overflow: hidden;
      margin: 10px auto 20px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .modal-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .modal-name {
      text-align: center;
      font-size: 28px;
      margin-bottom: 22px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .detail-box {
      padding: 16px;
      background: rgba(255,255,255,0.045);
      border-radius: 16px;
    }

    .detail-label {
      display: block;
      color: #8998aa;
      font-size: 12px;
      margin-bottom: 7px;
    }

    .detail-value {
      font-size: 15px;
      font-weight: bold;
    }

    .birthday-timer {
      margin-top: 18px;
      padding: 18px;
      text-align: center;
      border-radius: 18px;
      background: rgba(255,255,255,0.05);
    }

    .birthday-timer-title {
      color: #9caabd;
      font-size: 13px;
      margin-bottom: 9px;
    }

    .timer-value {
      font-size: 20px;
      font-weight: bold;
    }

    /* ================= NO RESULT ================= */

    .no-result {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #8998aa;
    }

    /* ================= LIGHT MODE ================= */

    body.light-mode {
      background:
        linear-gradient(rgba(245,247,250,0.94), rgba(238,242,247,0.97)),
        #eef2f7;
      color: #172033;
    }

    body.light-mode::before {
      opacity: 0.15;
    }

    body.light-mode header {

    }

    body.light-mode .subtitle {

    }

    body.light-mode .theme-toggle {
      color: #172033;
      background: rgba(0,0,0,0.05);
      border-color: rgba(0,0,0,0.08);
    }

    body.light-mode .search-box input {

      color: #172033;
      border-color: rgba(0,0,0,0.1);
    }

      color: #8993a3;
    }

    body.light-mode .birthday-section {
      background: rgba(255,255,255,0.75);
      border-color: rgba(0,0,0,0.08);
    }

    body.light-mode .birthday-toggle,
    body.light-mode .birthday-person {
      color: #172033;
    }

    body.light-mode .birthday-person {
      background: rgba(0,0,0,0.025);
    }

    body.light-mode .birthday-person:hover {
      background: rgba(0,0,0,0.06);
    }

    body.light-mode .birthday-icon,
    body.light-mode .birthday-rank {
      background: rgba(0,0,0,0.055);
    }

    body.light-mode .birthday-countdown,
    body.light-mode .birthday-arrow {
      color: #687386;
    }

    body.light-mode .person-card {
      background: rgba(255,255,255,0.78);
      border-color: rgba(0,0,0,0.08);
      box-shadow: 0 10px 30px rgba(30,40,60,0.06);
    }

    body.light-mode .person-card:hover {
      background: rgba(255,255,255,0.95);
      box-shadow: 0 18px 40px rgba(30,40,60,0.12);
    }

    body.light-mode .photo-frame {
      background: #e7ebf0;
      border-color: rgba(0,0,0,0.08);
    }

    body.light-mode .person-position {
      color: #687386;
    }

    body.light-mode .modal {
      background: rgba(20,28,40,0.45);
    }

    body.light-mode .modal-content {
      background: #ffffff;
      color: #172033;
      border-color: rgba(0,0,0,0.08);
    }

    body.light-mode .close-modal {
      background: rgba(0,0,0,0.06);
      color: #172033;
    }

    body.light-mode .detail-box,
    body.light-mode .birthday-timer {
      background: #f2f4f7;
    }

    body.light-mode .detail-label,
    body.light-mode .birthday-timer-title {
      color: #7a8494;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 900px) {
      .people-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      header {
        padding: 75px 15px 30px;
      }

      .logo {
        font-size: 31px;
      }

      .theme-toggle {
        top: 18px;
        left: 18px;
      }

      .container {
        width: 94%;
      }

      .people-grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .photo-frame {
        height: 360px;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .modal-content {
        padding: 20px;
        border-radius: 22px;
      }

      .modal-name {
        font-size: 23px;
      }

      .birthday-toggle {
        padding: 16px;
      }

      .birthday-person {
        padding: 13px;
      }

      .birthday-countdown {
        font-size: 12px;
      }
    }
  </style>
</head>

    /* =====================================================
       تبدیل اعداد
    ===================================================== */

    function toEnglishNumbers(value) {

      return String(value)
        .replace(/[۰-۹]/g, function(d) {
          return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
        })
        .replace(/[٠-٩]/g, function(d) {
          return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
        });

    }


    function persianNumber(number) {

      return String(number).replace(/\d/g, function(d) {
        return "۰۱۲۳۴۵۶۷۸۹"[d];
      });

    }


    /* =====================================================
       تاریخ شمسی فعلی
    ===================================================== */

    function getJalaliDate(date) {

      const formatter = new Intl.DateTimeFormat(
        "en-US-u-ca-persian",
        {
          year: "numeric",
          month: "numeric",
          day: "numeric"
        }
      );

      const parts = formatter.formatToParts(date);

      let year = "";
      let month = "";
      let day = "";

      parts.forEach(function(part) {

        if (part.type === "year") {
          year = parseInt(part.value);
        }

        if (part.type === "month") {
          month = parseInt(part.value);
        }

        if (part.type === "day") {
          day = parseInt(part.value);
        }

      });

      return {
        year: year,
        month: month,
        day: day
      };

    }


    /* =====================================================
       پیدا کردن تولد بعدی
    ===================================================== */

    function findNextBirthday(person) {

      const birthParts = toEnglishNumbers(person.birth)
        .split("/")
        .map(Number);

      const birthMonth = birthParts[1];
      const birthDay = birthParts[2];

      const now = new Date();

      for (let i = 0; i <= 370; i++) {

        const candidate = new Date(now);

        candidate.setDate(now.getDate() + i);

        const jalali = getJalaliDate(candidate);

        if (
          jalali.month === birthMonth &&
          jalali.day === birthDay
        ) {

          candidate.setHours(0, 0, 0, 0);

          if (candidate.getTime() >= now.getTime()) {
            return candidate;
          }

        }

      }

      return null;

    }


    function getNextBirthdayInfo(person) {
      return findNextBirthday(person);
    }


    /* =====================================================
       نمایش لیست تولدها
    ===================================================== */

    function renderBirthdayList() {

      const birthdayList =
        document.getElementById("birthdayList");

      const now = new Date();

      const sortedPeople = people
        .map(function(person, index) {

          const nextBirthday =
            getNextBirthdayInfo(person);

          return {
            person: person,
            index: index,
            nextBirthday: nextBirthday
          };

        })
        .sort(function(a, b) {

          return (
            a.nextBirthday.getTime() -
            b.nextBirthday.getTime()
          );

        });


      birthdayList.innerHTML = "";


      sortedPeople.forEach(function(item, position) {

        const difference =
          item.nextBirthday.getTime() -
          now.getTime();

        const totalDays =
          Math.floor(
            difference / 86400000
          );


        let countdownText;


        if (totalDays <= 0) {

          countdownText = "امروز 🎉";

        } else if (totalDays === 1) {

          countdownText = "فردا";

        } else {

          countdownText =
            persianNumber(totalDays) +
            " روز دیگر";

        }


        const button =
          document.createElement("button");

        button.className =
          "birthday-person";


        button.onclick = function() {

          showInfo(item.index);

        };


        button.innerHTML = `

          <div class="birthday-person-left">

            <span class="birthday-rank">
              ${persianNumber(position + 1)}
            </span>

            <span class="birthday-name">
              ${item.person.name}
            </span>

          </div>

          <span class="birthday-countdown">
            ${countdownText}
          </span>

        `;


        birthdayList.appendChild(button);

      });

    }


    function toggleBirthdayList() {

      const section =
        document.getElementById(
          "birthdaySection"
        );

      const isOpen =
        section.classList.contains("open");


      if (!isOpen) {
        renderBirthdayList();
      }


      section.classList.toggle("open");

    }


    /* =====================================================
       نمایش افراد
    ===================================================== */

    function renderPeople(list) {

      const grid =
        document.getElementById("peopleGrid");

      grid.innerHTML = "";


      if (list.length === 0) {

        grid.innerHTML = `
          <div class="no-result">
            چیزی پیدا نشد 😕
          </div>
        `;

        return;

      }


      list.forEach(function(person) {

        const originalIndex =
          people.indexOf(person);


        const card =
          document.createElement("article");

        card.className =
          "person-card";


        card.onclick = function() {

          showInfo(originalIndex);

        };


        card.innerHTML = `

          <div class="photo-frame">

            <img
              src="${person.image}"
              alt="${person.name}"
              loading="lazy"
            >

          </div>

          <div class="person-info">

            <div class="person-name">
              ${person.name}
            </div>

            <div class="person-position">
              ⚽ ${person.futsal}
            </div>

          </div>

        `;


        grid.appendChild(card);

      });

    }


    /* =====================================================
       نمایش پروفایل
    ===================================================== */

    function showInfo(index) {

      const person = people[index];

      document.getElementById("modalImage").src =
        person.image;

      document.getElementById("modalImage").alt =
        person.name;

      document.getElementById("modalName").textContent =
        person.name;


      document.getElementById("modalDetails").innerHTML = `

        <div class="detail-box">
          <span class="detail-label">
            🎂 سن
          </span>

          <span class="detail-value">
            ${persianNumber(person.age)} سال
          </span>
        </div>


        <div class="detail-box">
          <span class="detail-label">
            📅 تاریخ تولد
          </span>

          <span class="detail-value">
            ${persianNumber(person.birth)}
          </span>
        </div>


        <div class="detail-box">
          <span class="detail-label">
            🏫 مدرسه
          </span>

          <span class="detail-value">
            ${person.school}
          </span>
        </div>


        <div class="detail-box">
          <span class="detail-label">
            📚 پایه
          </span>

          <span class="detail-value">
            ${person.grade}
          </span>
        </div>


        <div class="detail-box" style="grid-column:1/-1;">
          <span class="detail-label">
            ⚽ پست فوتسال
          </span>

          <span class="detail-value">
            ${person.futsal}
          </span>
        </div>

      `;


      document.getElementById("profileModal")
        .classList.add("show");


      startBirthdayTimer(person);

    }


    function closeModal() {

      document.getElementById("profileModal")
        .classList.remove("show");

    }


    function handleModalClick(event) {

      if (
        event.target.id ===
        "profileModal"
      ) {

        closeModal();

      }

    }


    /* =====================================================
       شمارش معکوس تولد
    ===================================================== */

    let birthdayTimerInterval = null;


    function startBirthdayTimer(person) {

      if (birthdayTimerInterval) {

        clearInterval(
          birthdayTimerInterval
        );

      }


      function updateTimer() {

        const target =
          findNextBirthday(person);

        const now = new Date();

        const difference =
          target.getTime() -
          now.getTime();


        const timer =
          document.getElementById(
            "birthdayTimer"
          );


        if (difference <= 0) {

          timer.textContent =
            "🎉 امروز تولدشه!";

          return;

        }


        const days =
          Math.floor(
            difference / 86400000
          );

        const hours =
          Math.floor(
            (difference % 86400000) /
            3600000
          );

        const minutes =
          Math.floor(
            (difference % 3600000) /
            60000
          );

        const seconds =
          Math.floor(
            (difference % 60000) /
            1000
          );


        timer.textContent =
          persianNumber(days) +
          " روز، " +
          persianNumber(hours) +
          " ساعت، " +
          persianNumber(minutes) +
          " دقیقه و " +
          persianNumber(seconds) +
          " ثانیه";

      }


      updateTimer();


      birthdayTimerInterval =
        setInterval(
          updateTimer,
          1000
        );

    }


    /* =====================================================
       جستجو
    ===================================================== */

    document
      .getElementById("searchInput")
      .addEventListener(
        "input",
        function(event) {

          const query =
            event.target.value
              .trim()
              .toLowerCase();


          if (!query) {

            renderPeople(people);

            return;

          }


          const filtered =
            people.filter(function(person) {

              return (

                person.name
                  .toLowerCase()
                  .includes(query)

                ||

                person.school
                  .toLowerCase()
                  .includes(query)

                ||

                person.grade
                  .toLowerCase()
                  .includes(query)

                ||

                person.futsal
                  .toLowerCase()
                  .includes(query)

              );

            });


          renderPeople(filtered);

        }
      );


    /* =====================================================
       حالت شب / روز
    ===================================================== */

    function applySavedTheme() {

      const savedTheme =
        localStorage.getItem(
          "friendsSiteTheme"
        );


      const toggle =
        document.getElementById(
          "themeToggle"
        );


      if (savedTheme === "light") {

        document.body.classList.add(
          "light-mode"
        );

        toggle.textContent = "☀️";

      } else {

        document.body.classList.remove(
          "light-mode"
        );

        toggle.textContent = "🌙";

      }

    }


    function toggleTheme() {

      const isLight =
        document.body.classList.toggle(
          "light-mode"
        );


      const toggle =
        document.getElementById(
          "themeToggle"
        );


      if (isLight) {

        toggle.textContent = "☀️";

        localStorage.setItem(
          "friendsSiteTheme",
          "light"
        );

      } else {

        toggle.textContent = "🌙";

        localStorage.setItem(
          "friendsSiteTheme",
          "dark"
        );

      }

    }


    /* =====================================================
       بستن با ESC
    ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Escape") {

          closeModal();

        }

      }
    );


    /* =====================================================
       شروع سایت
    ===================================================== */

    applySavedTheme();

    renderPeople(people);

  </script>

</body>
</html>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#07101d;
  --bg2:#0b1625;
  --card:#101d2e;
  --card2:#142438;
  --text:#f5f7fb;
  --muted:#9eacbd;
  --accent:#27d17f;
  --accent2:#159b5b;
  --border:rgba(255,255,255,.08);
  --shadow:0 12px 35px rgba(0,0,0,.28);
}

body.light-mode{
  --bg:#eef2f5;
  --bg2:#f8fafc;
  --card:#ffffff;
  --card2:#f1f4f7;
  --text:#18212b;
  --muted:#66717e;
  --accent:#159b5b;
  --accent2:#0f814b;
  --border:rgba(0,0,0,.08);
  --shadow:0 10px 30px rgba(0,0,0,.10);
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(39,209,127,.09),
      transparent 30%
    ),
    radial-gradient(
      circle at 90% 100%,
      rgba(39,209,127,.06),
      transparent 30%
    ),
    var(--bg);
  color:var(--text);
  font-family:Tahoma,Arial,sans-serif;
  transition:background .3s ease,color .3s ease;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
    linear-gradient(
      rgba(255,255,255,.012) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(255,255,255,.012) 1px,
      transparent 1px
    );
  background-size:35px 35px;
}

/* =========================
   THEME ANIMATION
========================= */

::view-transition-old(root),
::view-transition-new(root){
  animation:none;
  mix-blend-mode:normal;
}

::view-transition-new(root){
  clip-path:circle(
    0px at var(--theme-x) var(--theme-y)
  );

  animation:
    themeCircle .65s
    cubic-bezier(.22,1,.36,1)
    forwards;
}

@keyframes themeCircle{
  to{
    clip-path:circle(
      var(--theme-radius)
      at var(--theme-x) var(--theme-y)
    );
  }
}

/* =========================
   HEADER
========================= */

header{
  width:min(1150px,calc(100% - 30px));
  margin:20px auto 0;
  min-height:80px;
  padding:16px 20px;
  border:1px solid var(--border);
  border-radius:24px;
  background:rgba(16,29,46,.88);
  backdrop-filter:blur(18px);
  box-shadow:var(--shadow);
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:relative;
  z-index:5;
}

body.light-mode header{
  background:rgba(255,255,255,.9);
}

.logo-area h1{
  font-size:28px;
  line-height:1.3;
}

.logo-area p{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

.theme-btn{
  width:48px;
  height:48px;
  flex-shrink:0;
  border-radius:50%;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--text);
  font-size:21px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:transform .2s ease;
}

.theme-btn:active{
  transform:scale(.9);
}

/* =========================
   MAIN
========================= */

main{
  width:min(1150px,calc(100% - 30px));
  margin:18px auto 45px;
  position:relative;
  z-index:2;
}

/* =========================
   SEARCH
========================= */

.search{
  position:sticky;
  top:10px;
  z-index:10;
  margin-bottom:16px;
}

.search input{
  width:100%;
  height:55px;
  border:1px solid var(--border);
  border-radius:18px;
  outline:none;
  background:var(--card);
  color:var(--text);
  padding:0 20px;
  font-family:inherit;
  font-size:15px;
  box-shadow:var(--shadow);
}

.search input::placeholder{
  color:var(--muted);
}

.search input:focus{
  border-color:var(--accent);
  box-shadow:
    0 0 0 3px rgba(39,209,127,.1),
    var(--shadow);
}

/* =========================
   BIRTHDAYS
========================= */

.birthday{
  border:1px solid var(--border);
  background:var(--card);
  border-radius:20px;
  overflow:hidden;
  margin-bottom:17px;
  box-shadow:var(--shadow);
}

.birthday-button{
  width:100%;
  min-height:52px;
  border:0;
  background:transparent;
  color:var(--text);
  padding:0 17px;
  font-family:inherit;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.arrow{
  color:var(--muted);
  transition:transform .25s;
}

.birthday.open .arrow{
  transform:rotate(180deg);
}

.birthday-list{
  display:none;
  padding:0 10px 10px;
}

.birthday.open .birthday-list{
  display:block;
}

.birthday-row{
  min-height:48px;
  border-top:1px solid var(--border);
  border-radius:12px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px;
  cursor:pointer;
}

.birthday-row:active{
  background:rgba(127,127,127,.08);
}

.rank{
  width:30px;
  height:30px;
  border-radius:50%;
  flex-shrink:0;
  background:rgba(39,209,127,.12);
  color:var(--accent);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:12px;
  font-weight:bold;
}

.birthday-name{
  flex:1;
  font-size:13px;
  font-weight:bold;
}

.birthday-time{
  color:var(--muted);
  font-size:10px;
  white-space:nowrap;
}

/* =========================
   PEOPLE GRID
========================= */

.people{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  overflow:hidden;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  box-shadow:var(--shadow);
  cursor:pointer;
  transition:
    transform .2s ease,
    border-color .2s ease;
}

.card:hover{
  transform:translateY(-4px);
  border-color:rgba(39,209,127,.35);
}

.card:active{
  transform:scale(.98);
}

.card-image{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  display:block;
  background:var(--card2);
}

.card-info{
  padding:14px;
}

.card-name{
  font-size:16px;
  font-weight:bold;
  line-height:1.5;
  margin-bottom:5px;
}

.card-position{
  color:var(--muted);
  font-size:12px;
  line-height:1.7;
}

.empty{
  grid-column:1/-1;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
  border:1px solid var(--border);
  background:var(--card);
  border-radius:20px;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
}

.modal.show{
  display:flex;
}

.modal-box{
  width:min(510px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
  position:relative;
  animation:modalShow .25s ease;
}

@keyframes modalShow{
  from{
    opacity:0;
    transform:scale(.95) translateY(12px);
  }

  to{
    opacity:1;
    transform:none;
  }
}

.close{
  position:absolute;
  top:12px;
  left:12px;
  z-index:5;
  width:42px;
  height:42px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.58);
  color:#fff;
  font-size:18px;
  cursor:pointer;
}

.modal-image{
  width:100%;
  height:330px;
  object-fit:cover;
  display:block;
}

.modal-content{
  padding:22px;
}

.modal-name{
  font-size:25px;
  margin-bottom:18px;
}

.details{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

.detail{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:15px;
  padding:12px;
}

.detail.full{
  grid-column:1/-1;
}

.detail-title{
  display:block;
  color:var(--muted);
  font-size:10px;
  margin-bottom:6px;
}

.detail-value{
  font-size:13px;
  font-weight:bold;
  line-height:1.7;
}

.timer{
  margin-top:12px;
  padding:15px;
  border-radius:17px;
  background:rgba(39,209,127,.08);
  border:1px solid rgba(39,209,127,.18);
  text-align:center;
}

.timer-title{
  color:var(--muted);
  font-size:11px;
  margin-bottom:7px;
}

.timer-value{
  color:var(--accent);
  font-size:14px;
  font-weight:bold;
  line-height:1.9;
}

/* =========================
   FOOTER
========================= */

footer{
  text-align:center;
  color:var(--muted);
  font-size:11px;
  padding:0 20px 30px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:650px){

  .card-position{

  }

  .modal-box{
    width:100%;
    max-height:94vh;
    border-radius:26px 26px 0 0;

  }

    from{
      transform:translateY(100%);
    }

    to{
      transform:translateY(0);
    }
  }

  }

  .modal-content{

  .modal-name{

  .timer{

  .timer-value{

  }

  .close{
    width:40px;
    height:40px;
    top:10px;
    left:10px;
  }

/* =========================
   VERY SMALL PHONES
========================= */

@media(max-width:380px){

  header{
    width:calc(100% - 12px);
  }

  main{
    width:calc(100% - 12px);
  }

  .people{
    gap:7px;
  }

  .card-info{
    padding:8px;

  .card-position{
    font-size:9px;
  }

  .birthday-time{
    display:none;
  }

  .modal-image{
    height:255px;
  }

/* =========================
   TABLET
========================= */

@media(min-width:651px) and (max-width:900px){

  .people{
    grid-template-columns:repeat(2,1fr);
  }
}

/* =========================
   PERSIAN DATE
========================= */

function getPersianDate(date){

  const formatter =
    new Intl.DateTimeFormat(
      "en-US-u-ca-persian",
      {
        year:"numeric",
        month:"numeric",
        day:"numeric"
      }
    );

  const parts =
    formatter.formatToParts(date);

  const result = {};

  parts.forEach(part => {

    if(
      part.type === "year" ||
      part.type === "month" ||
      part.type === "day"
    ){
      result[part.type] =
        Number(part.value);
    }

  });

  return result;
}


function parseBirth(birth){

  const p =
    birth.split("/").map(Number);

  return {
    year:p[0],
    month:p[1],
    day:p[2]
  };
}


/* =========================
   NEXT BIRTHDAY
========================= */

function getNextBirthday(person){

  const birth =
    parseBirth(person.birth);

  const now =
    new Date();

  for(let i=0;i<=370;i++){

    const candidate =
      new Date(now);

    candidate.setHours(0,0,0,0);

    candidate.setDate(
      candidate.getDate()+i
    );

    const p =
      getPersianDate(candidate);

    if(
      p.month === birth.month &&
      p.day === birth.day &&
      candidate > now
    ){
      return candidate;
    }

  }

  return null;
}


/* =========================
   COUNTDOWN
========================= */

function getCountdown(target){

  let diff =
    Math.max(
      0,
      target - new Date()
    );

  const days =
    Math.floor(diff/86400000);

  diff %= 86400000;

  const hours =
    Math.floor(diff/3600000);

  diff %= 3600000;

  const minutes =
    Math.floor(diff/60000);

  diff %= 60000;

  const seconds =
    Math.floor(diff/1000);

  return `${days} روز و ${hours} ساعت و ${minutes} دقیقه و ${seconds} ثانیه`;
}


function getShortCountdown(target){

  const diff =
    Math.max(
      0,
      target - new Date()
    );

  const days =
    Math.floor(diff/86400000);

  if(days > 0)
    return `${days} روز دیگر`;

  const hours =
    Math.floor(diff/3600000);

  if(hours > 0)
    return `${hours} ساعت دیگر`;

  const minutes =
    Math.floor(diff/60000);

  return `${minutes} دقیقه دیگر`;
}

    `;

    return;
  }


  list.forEach(person => {

    const card =
      document.createElement("article");

    card.className="card";

    card.innerHTML=`

      <img
        class="card-image"
        src="${person.image}"
        alt="${person.name}"
        loading="lazy"
      >

      <div class="card-info">

        <div class="card-name">
          ${person.name}
        </div>

        <div class="card-position">
          ⚽ ${person.position}
        </div>

      </div>
    `;

    card.addEventListener(
      "click",
      () => openProfile(person)
    );

    peopleGrid.appendChild(card);

  });

}


/* =========================
   SEARCH
========================= */

searchInput.addEventListener(
  "input",
  () => {

    const value =
      searchInput.value
        .trim()
        .toLowerCase();

    const result =
      people.filter(person =>
        person.name
          .toLowerCase()
          .includes(value)
      );

    renderPeople(result);

  }
);


/* =========================
   BIRTHDAY LIST
========================= */

function renderBirthdays(){

  const sorted =
    people
      .map(person => ({
        person,
        date:getNextBirthday(person)
      }))
      .filter(x => x.date)
      .sort(
        (a,b) =>
          a.date-b.date
      );

  birthdayList.innerHTML="";

  sorted.forEach(
    (item,index) => {

      const row =
        document.createElement("div");

      row.className="birthday-row";

      row.innerHTML=`

        <div class="rank">
          ${index+1}
        </div>

        <div class="birthday-name">
          ${item.person.name}
        </div>

        <div class="birthday-time">
          ${getShortCountdown(item.date)}
        </div>

      `;

      row.addEventListener(
        "click",
        () => openProfile(item.person)
      );

      birthdayList.appendChild(row);

    }
  );

}


birthdayButton.addEventListener(
  "click",
  () => {

    birthdayBox.classList.toggle("open");

  }
);


/* =========================
   MODAL
========================= */

let currentPerson=null;

function openProfile(person){

  currentPerson=person;

  modalImage.src=person.image;
  modalImage.alt=person.name;

  modalName.textContent=person.name;
  modalAge.textContent=person.age;
  modalBirth.textContent=person.birth;
  modalSchool.textContent=person.school;
  modalGrade.textContent=person.grade;
  modalPosition.textContent=person.position;

  profileModal.classList.add("show");

  document.body.style.overflow="hidden";

  updateTimer();
}


function closeProfile(){

  profileModal.classList.remove("show");

  document.body.style.overflow="";

  currentPerson=null;
}


closeModal.addEventListener(
  "click",
  closeProfile
);


profileModal.addEventListener(
  "click",
  e => {

    if(e.target===profileModal){
      closeProfile();
    }

  }
);


document.addEventListener(
  "keydown",
  e => {

    if(e.key==="Escape"){
      closeProfile();
    }

  }
);


/* =========================
   LIVE TIMER
========================= */

function updateTimer(){

  if(!currentPerson)
    return;

  const target =
    getNextBirthday(currentPerson);

  if(!target){

    birthdayTimer.textContent="نامشخص";
    return;

  }

  birthdayTimer.textContent =
    getCountdown(target);

}


setInterval(
  updateTimer,
  1000
);


/* =========================
   THEME
========================= */

function getThemePosition(){

  const rect =
    themeToggle.getBoundingClientRect();

  const x =
    rect.left + rect.width/2;

  const y =
    rect.top + rect.height/2;

  const radius =
    Math.hypot(
      Math.max(
        x,
        window.innerWidth-x
      ),
      Math.max(
        y,
        window.innerHeight-y
      )
    );

  return {
    x,
    y,
    radius
  };
}


function applyTheme(light){

  document.body.classList.toggle(
    "light-mode",
    light
  );

  themeToggle.textContent =
    light ? "☀️" : "🌙";

  document
    .getElementById("themeColor")
    .setAttribute(
      "content",
      light ? "#f2f5f8" : "#07101d"
    );

  localStorage.setItem(
    "friendsSiteTheme",
    light ? "light" : "dark"
  );
}


function toggleTheme(){

  const light =
    !document.body.classList.contains(
      "light-mode"
    );

  const pos =
    getThemePosition();

  document.documentElement.style.setProperty(
    "--theme-x",
    `${pos.x}px`
  );

  document.documentElement.style.setProperty(
    "--theme-y",
    `${pos.y}px`
  );

  document.documentElement.style.setProperty(
    "--theme-radius",
    `${pos.radius}px`
  );


  if(document.startViewTransition){

    document.startViewTransition(
      () => applyTheme(light)
    );

  }else{

    applyTheme(light);

  }

}


themeToggle.addEventListener(
  "click",
  toggleTheme
);


/* =========================
   LOAD SAVED THEME
========================= */

const savedTheme =
  localStorage.getItem(
    "friendsSiteTheme"
  );

applyTheme(
  savedTheme === "light"
);


/* =========================
   START
========================= */

renderPeople();
renderBirthdays();

</script>

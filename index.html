    /* =====================================================
       اعداد فارسی
    ===================================================== */

    function toEnglishNumbers(value) {

      return String(value)
        .replace(/[۰-۹]/g, function(d) {
          return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);
        })
        .replace(/[٠-٩]/g, function(d) {
          return "٠١٢٣٤٥٦٧٨٩".indexOf(d);
        });

    }


    function persianNumber(number) {

      return String(number).replace(
        /\d/g,
        function(d) {
          return "۰۱۲۳۴۵۶۷۸۹"[d];
        }
      );

    }


    /* =====================================================
       تاریخ شمسی
    ===================================================== */

    function getJalaliDate(date) {

      const formatter =
        new Intl.DateTimeFormat(
          "en-US-u-ca-persian",
          {
            year: "numeric",
            month: "numeric",
            day: "numeric"
          }
        );


      const parts =
        formatter.formatToParts(date);


      let year = "";
      let month = "";
      let day = "";


      parts.forEach(function(part) {

        if (part.type === "year") {
          year = parseInt(part.value);
        }

        if (part.type === "month") {
          month = parseInt(part.value);
        }

        if (part.type === "day") {
          day = parseInt(part.value);
        }

      });


      return {
        year: year,
        month: month,
        day: day
      };

    }


    /* =====================================================
       تولد بعدی
    ===================================================== */

    function findNextBirthday(person) {

      const birthParts =
        toEnglishNumbers(person.birth)
          .split("/")
          .map(Number);


      const birthMonth =
        birthParts[1];

      const birthDay =
        birthParts[2];


      const now = new Date();


      for (let i = 0; i <= 370; i++) {

        const candidate =
          new Date(now);


        candidate.setDate(
          now.getDate() + i
        );


        const jalali =
          getJalaliDate(candidate);


        if (
          jalali.month === birthMonth &&
          jalali.day === birthDay
        ) {

          candidate.setHours(
            0,
            0,
            0,
            0
          );


          if (
            candidate.getTime() >=
            now.getTime()
          ) {

            return candidate;

          }

        }

      }


      return null;

    }


    function getNextBirthdayInfo(person) {

      return findNextBirthday(person);

    }


    /* =====================================================
       لیست تولدها
    ===================================================== */

    function renderBirthdayList() {

      const birthdayList =
        document.getElementById(
          "birthdayList"
        );


      const now = new Date();


      const sortedPeople =
        people
          .map(function(person, index) {

            const nextBirthday =
              getNextBirthdayInfo(person);


            return {
              person: person,
              index: index,
              nextBirthday: nextBirthday
            };

          })
          .sort(function(a, b) {

            return (
              a.nextBirthday.getTime() -
              b.nextBirthday.getTime()
            );

          });


      birthdayList.innerHTML = "";


      sortedPeople.forEach(
        function(item, position) {

          const difference =
            item.nextBirthday.getTime() -
            now.getTime();


          const totalDays =
            Math.floor(
              difference / 86400000
            );


          let countdownText;


          if (totalDays <= 0) {

            countdownText =
              "امروز 🎉";

          } else if (totalDays === 1) {

            countdownText =
              "فردا";

          } else {

            countdownText =
              persianNumber(totalDays) +
              " روز دیگر";

          }


          const button =
            document.createElement(
              "button"
            );


          button.className =
            "birthday-person";


          button.type =
            "button";


          button.innerHTML = `

            <div class="birthday-person-left">

              <span class="birthday-rank">
                ${persianNumber(position + 1)}
              </span>

              <span class="birthday-name">
                ${item.person.name}
              </span>

            </div>

            <span class="birthday-countdown">
              ${countdownText}
            </span>

          `;


          button.addEventListener(
            "click",
            function() {

              showInfo(item.index);

            }
          );


          birthdayList.appendChild(
            button
          );

        }
      );

    }


    document
      .getElementById(
        "birthdayToggle"
      )
      .addEventListener(
        "click",
        function() {

          const section =
            document.getElementById(
              "birthdaySection"
            );


          const isOpen =
            section.classList.contains(
              "open"
            );


          if (!isOpen) {

            renderBirthdayList();

          }


          section.classList.toggle(
            "open"
          );

        }
      );


    /* =====================================================
       نمایش افراد
    ===================================================== */

    function renderPeople(list) {

      const grid =
        document.getElementById(
          "peopleGrid"
        );


      grid.innerHTML = "";


      if (list.length === 0) {

        grid.innerHTML = `
          <div class="no-result">
            چیزی پیدا نشد 😕
          </div>
        `;

        return;

      }


      list.forEach(function(person) {

        const originalIndex =
          people.indexOf(person);


        const card =
          document.createElement(
            "article"
          );


        card.className =
          "person-card";


        card.innerHTML = `

          <div class="photo-frame">

            <img
              src="${person.image}"
              alt="${person.name}"
              loading="lazy"
            >

          </div>

          <div class="person-info">

            <div class="person-name">
              ${person.name}
            </div>

            <div class="person-position">
              ⚽ ${person.futsal}
            </div>

          </div>

        `;


        card.addEventListener(
          "click",
          function() {

            showInfo(originalIndex);

          }
        );


        grid.appendChild(card);

      });

    }


    /* =====================================================
       پروفایل
    ===================================================== */

    function showInfo(index) {

      const person =
        people[index];


      document.getElementById(
        "modalImage"
      ).src =
        person.image;


      document.getElementById(
        "modalImage"
      ).alt =
        person.name;


      document.getElementById(
        "modalName"
      ).textContent =
        person.name;


      document.getElementById(
        "modalDetails"
      ).innerHTML = `

        <div class="detail-box">

          <span class="detail-label">
            🎂 سن
          </span>

          <span class="detail-value">
            ${persianNumber(person.age)} سال
          </span>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            📅 تاریخ تولد
          </span>

          <span class="detail-value">
            ${persianNumber(person.birth)}
          </span>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            🏫 مدرسه
          </span>

          <span class="detail-value">
            ${person.school}
          </span>

        </div>


        <div class="detail-box">

          <span class="detail-label">
            📚 پایه
          </span>

          <span class="detail-value">
            ${person.grade}
          </span>

        </div>


        <div
          class="detail-box"
          style="grid-column:1/-1;"
        >

          <span class="detail-label">
            ⚽ پست فوتسال
          </span>

          <span class="detail-value">
            ${person.futsal}
          </span>

        </div>

      `;


      document
        .getElementById(
          "profileModal"
        )
        .classList.add("show");


      startBirthdayTimer(person);

    }


    function closeModal() {

      document
        .getElementById(
          "profileModal"
        )
        .classList.remove("show");

    }


    document
      .getElementById(
        "closeModal"
      )
      .addEventListener(
        "click",
        closeModal
      );


    document
      .getElementById(
        "profileModal"
      )
      .addEventListener(
        "click",
        function(event) {

          if (
            event.target.id ===
            "profileModal"
          ) {

            closeModal();

          }

        }
      );


    /* =====================================================
       شمارش تولد
    ===================================================== */

    let birthdayTimerInterval =
      null;


    function startBirthdayTimer(person) {

      if (birthdayTimerInterval) {

        clearInterval(
          birthdayTimerInterval
        );

      }


      function updateTimer() {

        const target =
          findNextBirthday(person);


        const now =
          new Date();


        const difference =
          target.getTime() -
          now.getTime();


        const timer =
          document.getElementById(
            "birthdayTimer"
          );


        if (difference <= 0) {

          timer.textContent =
            "🎉 امروز تولدشه!";

          return;

        }


        const days =
          Math.floor(
            difference / 86400000
          );


        const hours =
          Math.floor(
            (difference % 86400000) /
            3600000
          );


        const minutes =
          Math.floor(
            (difference % 3600000) /
            60000
          );


        const seconds =
          Math.floor(
            (difference % 60000) /
            1000
          );


        timer.textContent =
          persianNumber(days) +
          " روز، " +
          persianNumber(hours) +
          " ساعت، " +
          persianNumber(minutes) +
          " دقیقه و " +
          persianNumber(seconds) +
          " ثانیه";

      }


      updateTimer();


      birthdayTimerInterval =
        setInterval(
          updateTimer,
          1000
        );

    }


    /* =====================================================
       جستجو
    ===================================================== */

    document
      .getElementById(
        "searchInput"
      )
      .addEventListener(
        "input",
        function(event) {

          const query =
            event.target.value
              .trim()
              .toLowerCase();


          if (!query) {

            renderPeople(people);

            return;

          }


          const filtered =
            people.filter(
              function(person) {

                return (

                  person.name
                    .toLowerCase()
                    .includes(query)

                  ||

                  person.school
                    .toLowerCase()
                    .includes(query)

                  ||

                  person.grade
                    .toLowerCase()
                    .includes(query)

                  ||

                  person.futsal
                    .toLowerCase()
                    .includes(query)

                );

              }
            );


          renderPeople(filtered);

        }
      );


    /* =====================================================
       حالت شب / روز
       افکت دایره‌ای از خود دکمه
    ===================================================== */

    const themeToggle =
      document.getElementById(
        "themeToggle"
      );


    const themeToggleIcon =
      document.getElementById(
        "themeToggleIcon"
      );


    function applySavedTheme() {

      const savedTheme =
        localStorage.getItem(
          "friendsSiteTheme"
        );


      if (savedTheme === "light") {

        document.body.classList.add(
          "light-mode"
        );

        themeToggleIcon.textContent =
          "☀️";

      } else {

        document.body.classList.remove(
          "light-mode"
        );

        themeToggleIcon.textContent =
          "🌙";

      }

    }


    function getThemeCirclePosition() {

      const rect =
        themeToggle.getBoundingClientRect();


      const x =
        rect.left +
        rect.width / 2;


      const y =
        rect.top +
        rect.height / 2;


      const radius =
        Math.hypot(
          Math.max(x, window.innerWidth - x),
          Math.max(y, window.innerHeight - y)
        );


      return {
        x: x,
        y: y,
        radius: radius
      };

    }


    function changeTheme() {

      const isCurrentlyLight =
        document.body.classList.contains(
          "light-mode"
        );


      const newTheme =
        isCurrentlyLight
          ? "dark"
          : "light";


      const position =
        getThemeCirclePosition();


      document.documentElement.style.setProperty(
        "--theme-x",
        position.x + "px"
      );


      document.documentElement.style.setProperty(
        "--theme-y",
        position.y + "px"
      );


      document.documentElement.style.setProperty(
        "--theme-radius",
        position.radius + "px"
      );


      themeToggle.classList.add(
        "switching"
      );


      function updateTheme() {

        document.body.classList.toggle(
          "light-mode",
          newTheme === "light"
        );


        localStorage.setItem(
          "friendsSiteTheme",
          newTheme
        );


        themeToggleIcon.textContent =
          newTheme === "light"
            ? "☀️"
            : "🌙";

      }


      /*
        اگر مرورگر View Transition داشته باشد،
        تغییر تم با دایره از خود دکمه انجام می‌شود.
      */

      if (
        document.startViewTransition
      ) {

        const transition =
          document.startViewTransition(
            updateTheme
          );


        transition.finished
          .finally(function() {

            setTimeout(
              function() {

                themeToggle.classList.remove(
                  "switching"
                );

              },
              30
            );

          });

      } else {

        /*
          حالت جایگزین برای مرورگرهای قدیمی‌تر
        */

        document.body.style.transition =
          "opacity 0.15s ease";

        document.body.style.opacity =
          "0.35";


        setTimeout(
          function() {

            updateTheme();

            requestAnimationFrame(
              function() {

                document.body.style.opacity =
                  "1";

                setTimeout(
                  function() {

                    document.body.style.transition =
                      "";

                    themeToggle.classList.remove(
                      "switching"
                    );

                  },
                  180
                );

              }
            );

          },
          80
        );

      }

    }


    themeToggle.addEventListener(
      "click",
      changeTheme
    );


    /* =====================================================
       ESC
    ===================================================== */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape"
        ) {

          closeModal();

        }

      }
    );


    /* =====================================================
       شروع سایت
    ===================================================== */

    applySavedTheme();

    renderPeople(people);

  </script>

</body>
</html>
